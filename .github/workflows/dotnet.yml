name: .NET Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: |
        dotnet restore PublisherService/PublisherService.csproj
        dotnet restore ConsumerService/ConsumerService.csproj
        dotnet restore PublisherService.Tests/PublisherService.Tests.csproj

    - name: Build
      run: |
        dotnet build PublisherService/PublisherService.csproj --no-restore
        dotnet build ConsumerService/ConsumerService.csproj --no-restore
        dotnet build PublisherService.Tests/PublisherService.Tests.csproj --no-restore

    - name: Test
      run: dotnet test PublisherService.Tests/PublisherService.Tests.csproj --no-build --verbosity normal
